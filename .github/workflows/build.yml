name: Build (Windows + macOS)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------- Rust / Tauri ----------------
  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   name: macOS Apple Silicon, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app/src-tauri
      - name: Test protocol
        working-directory: rust-app/src-tauri
        run: cargo test --lib
      - name: Check Apple signing secrets
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      # macOS: Developer ID bilan imzolash + Apple notarizatsiyasi (secret'lar bo'lsa)
      - name: Build bundle (macOS, signed + notarized)
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        working-directory: rust-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}

      # macOS: secret'lar yo'q — bepul ad-hoc imzo
      - name: Build bundle (macOS, ad-hoc signed)
        if: runner.os == 'macOS' && steps.apple.outputs.signed != 'true'
        working-directory: rust-app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}

      - name: Build bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: rust-app
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: uz-meter-rust-${{ matrix.target }}
          path: |
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------- Release (faqat v* teglar) ----------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename files by platform
        run: |
          mkdir -p release
          cp dist/uz-meter-rust-x86_64-pc-windows-msvc/msi/*.msi          release/Uz-Meter-windows-x64.msi
          cp dist/uz-meter-rust-x86_64-pc-windows-msvc/nsis/*.exe         release/Uz-Meter-windows-x64-setup.exe
          cp dist/uz-meter-rust-aarch64-apple-darwin/dmg/*.dmg            release/Uz-Meter-macos-apple-silicon.dmg
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
