name: Build (Windows + macOS)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------- Rust / Tauri ----------------
  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   name: macOS Apple Silicon, target: aarch64-apple-darwin }
          - { os: macos-latest,   name: macOS Intel, target: x86_64-apple-darwin }   # Apple Silicon mashinasida kross-kompilyatsiya (macos-13 runner deyarli yo'q)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app/src-tauri
      - name: Test protocol
        working-directory: rust-app/src-tauri
        run: cargo test --lib
      - name: Build bundle
        working-directory: rust-app
        run: npx --yes @tauri-apps/cli@latest build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: uz-meter-rust-${{ matrix.target }}
          path: |
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------- .NET / Avalonia ----------------
  dotnet:
    name: .NET · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64, rid: win-x64 }
          - { os: macos-latest,   name: macOS Apple Silicon, rid: osx-arm64 }
          - { os: macos-latest,   name: macOS Intel, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Self-test protocol
        working-directory: dotnet-app
        run: dotnet run -c Release -- --selftest
      - name: Publish
        working-directory: dotnet-app
        run: >
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/${{ matrix.rid }}
      - name: Make macOS .app bundle
        if: startsWith(matrix.rid, 'osx')
        working-directory: dotnet-app
        run: |
          APP="out/Uz-Meter.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp out/${{ matrix.rid }}/UzMeter "$APP/MacOS/UzMeter"
          cp out/${{ matrix.rid }}/*.dylib "$APP/MacOS/" 2>/dev/null || true
          cp macos/Info.plist "$APP/Info.plist"
          chmod +x "$APP/MacOS/UzMeter"
          cd out && zip -r "Uz-Meter-${{ matrix.rid }}.zip" "Uz-Meter.app"
      - uses: actions/upload-artifact@v4
        with:
          name: uz-meter-dotnet-${{ matrix.rid }}
          path: |
            dotnet-app/out/${{ matrix.rid }}/UzMeter.exe
            dotnet-app/out/Uz-Meter-${{ matrix.rid }}.zip
          if-no-files-found: error

  # ---------------- Release (faqat v* teglar) ----------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename files by platform
        run: |
          mkdir -p release
          cp dist/uz-meter-rust-x86_64-pc-windows-msvc/msi/*.msi          release/Uz-Meter-rust-windows-x64.msi
          cp dist/uz-meter-rust-x86_64-pc-windows-msvc/nsis/*.exe         release/Uz-Meter-rust-windows-x64-setup.exe
          cp dist/uz-meter-rust-aarch64-apple-darwin/dmg/*.dmg            release/Uz-Meter-rust-macos-apple-silicon.dmg
          cp dist/uz-meter-rust-x86_64-apple-darwin/dmg/*.dmg             release/Uz-Meter-rust-macos-intel.dmg
          cp dist/uz-meter-dotnet-win-x64/win-x64/UzMeter.exe             release/Uz-Meter-dotnet-windows-x64.exe
          cp dist/uz-meter-dotnet-osx-arm64/Uz-Meter-osx-arm64.zip        release/Uz-Meter-dotnet-macos-apple-silicon.zip
          cp dist/uz-meter-dotnet-osx-x64/Uz-Meter-osx-x64.zip            release/Uz-Meter-dotnet-macos-intel.zip
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
