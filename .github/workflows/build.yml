name: Build (Windows + macOS)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------- Rust / Tauri ----------------
  rust:
    name: Rust · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   name: macOS Apple Silicon, target: aarch64-apple-darwin }
          - { os: macos-13,       name: macOS Intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app/src-tauri
      - name: Test protocol
        working-directory: rust-app/src-tauri
        run: cargo test --lib
      - name: Build bundle
        working-directory: rust-app
        run: npx --yes @tauri-apps/cli@latest build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: uz-meter-rust-${{ matrix.target }}
          path: |
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rust-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------- .NET / Avalonia ----------------
  dotnet:
    name: .NET · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64, rid: win-x64 }
          - { os: macos-latest,   name: macOS Apple Silicon, rid: osx-arm64 }
          - { os: macos-latest,   name: macOS Intel, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Self-test protocol
        working-directory: dotnet-app
        run: dotnet run -c Release -- --selftest
      - name: Publish
        working-directory: dotnet-app
        run: >
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/${{ matrix.rid }}
      - name: Make macOS .app bundle
        if: startsWith(matrix.rid, 'osx')
        working-directory: dotnet-app
        run: |
          APP="out/Uz-Meter.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp out/${{ matrix.rid }}/UzMeter "$APP/MacOS/UzMeter"
          cp out/${{ matrix.rid }}/*.dylib "$APP/MacOS/" 2>/dev/null || true
          cp macos/Info.plist "$APP/Info.plist"
          chmod +x "$APP/MacOS/UzMeter"
          cd out && zip -r "Uz-Meter-${{ matrix.rid }}.zip" "Uz-Meter.app"
      - uses: actions/upload-artifact@v4
        with:
          name: uz-meter-dotnet-${{ matrix.rid }}
          path: |
            dotnet-app/out/${{ matrix.rid }}/UzMeter.exe
            dotnet-app/out/Uz-Meter-${{ matrix.rid }}.zip
          if-no-files-found: error
